# Server Configuration
server.port=8080

# Static Resources
spring.web.resources.static-locations=classpath:/static/,classpath:/webapp/
spring.web.resources.add-mappings=true

# WebSocket Configuration
# WebSocket 버퍼 크기 설정 (선택사항)
spring.websocket.buffer-size=8192

# CORS Configuration (개발 환경)
# 프로덕션에서는 특정 도메인만 허용하도록 변경 필요

# External API Configuration
# Nexon API 설정 (API 키는 실제 키로 변경 필요)
nexon.api.key=
nexon.api.base-url=https://open.api.nexon.com

# Logging
logging.level.com.chat=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.socket=DEBUG