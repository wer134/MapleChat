# Server Configuration
server.port=8080

# Static Resources
spring.web.resources.static-locations=classpath:/static/,classpath:/webapp/
spring.web.resources.add-mappings=true

# CORS Configuration (개발 환경)
# 프로덕션에서는 특정 도메인만 허용하도록 변경 필요

# Logging
logging.level.com.chat=DEBUG
logging.level.org.springframework.web=INFO
